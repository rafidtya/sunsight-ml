[project]
name = "sunsight-ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "ultralytics>=8.4.204",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roof_inference"]

# Torch CPU-only: image jauh lebih kecil, cocok untuk EC2 tanpa GPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
