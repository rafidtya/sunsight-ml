services:
  ml:
    image: ${ML_IMAGE:?ML_IMAGE wajib di-set}
    container_name: sunsight-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MODEL_DEVICE: ${MODEL_DEVICE:-cpu}
      MODEL_VERSION: ${MODEL_VERSION:-latest}
      # Kosong berarti pemeriksaan kunci dimatikan. Nilai sebenarnya hidup di
      # .env sebelah berkas ini, sehingga CI tidak perlu memegang rahasianya.
      ML_API_KEY: ${ML_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
